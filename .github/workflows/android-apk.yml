name: Build Android Test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Compile and upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create --platforms=android,ios --org com.foxsecura --project-name foxsecura_mobile .
      - name: Install Flutter packages
        run: flutter pub get
      - name: Prepare icon renderer
        run: python3 -m pip install --user 'cairosvg==2.8.2'
      - name: Generate FoxSecura launcher icons
        run: python3 scripts/generate_android_icons.py
      - name: Validate project
        run: |
          flutter analyze
          flutter test
      - name: Build APK (debug signing only)
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FoxSecura-Android-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
