name: Flutter checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        run: flutter create --platforms=android,ios --org com.foxsecura --project-name foxsecura_mobile .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
